spring.application.name=gst-service
server.port=${SERVER_PORT:8091}

spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_gst

management.endpoints.web.exposure.include=health,info,prometheus
logging.pattern.level=%5p [${spring.application.name:},%X{requestId:-}]

spring.cloud.circuitbreaker.resilience4j.enabled=true
management.health.circuitbreakers.enabled=true

gst.tax.default-rate-percent=${GST_DEFAULT_RATE_PERCENT:18}
gst.tax.inclusive-fallback-on-missing-line-percent=${GST_INCLUSIVE_FALLBACK_PERCENT:18}
gst.einvoice.provider=${GST_EINVOICE_PROVIDER:mock}
gst.eway.provider=${GST_EWAY_PROVIDER:mock}
# Live GSP HTTP adapter (used only when provider=http). Leave blank to get a clear not-configured error.
gst.gsp.base-url=${GST_GSP_BASE_URL:}
gst.gsp.api-key=${GST_GSP_API_KEY:}
gst.gsp.einvoice-path=${GST_GSP_EINVOICE_PATH:/einvoice/generate}
gst.gsp.eway-path=${GST_GSP_EWAY_PATH:/eway/generate}
gst.gsp.einvoice-cancel-path=${GST_GSP_EINVOICE_CANCEL_PATH:/einvoice/cancel}
gst.gsp.eway-cancel-path=${GST_GSP_EWAY_CANCEL_PATH:/eway/cancel}
gst.gsp.eway-part-b-path=${GST_GSP_EWAY_PART_B_PATH:/eway/part-b}
gst.gsp.filing-path=${GST_GSP_FILING_PATH:/gstr/upload}
gst.gsp.connect-timeout-ms=${GST_GSP_CONNECT_TIMEOUT_MS:5000}
gst.gsp.read-timeout-ms=${GST_GSP_READ_TIMEOUT_MS:30000}
# When true, gst-service refuses to start in live mode without GST_GSP_API_KEY.
gst.gsp.require-api-key=${GST_GSP_REQUIRE_API_KEY:false}

# GSTIN search (authorized GSP / local gst-mock). Credentials stay server-side.
gst.verification.enabled=${GST_VERIFICATION_ENABLED:false}
gst.verification.base-url=${GST_VERIFICATION_BASE_URL:}
gst.verification.api-key=${GST_VERIFICATION_API_KEY:}
gst.verification.api-secret=${GST_VERIFICATION_API_SECRET:}
gst.verification.connect-timeout-ms=${GST_VERIFICATION_CONNECT_TIMEOUT_MS:4000}
gst.verification.read-timeout-ms=${GST_VERIFICATION_READ_TIMEOUT_MS:8000}

app.cache.redis-enabled=${APP_CACHE_REDIS_ENABLED:false}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# JWT enforcement (security-common)
# ===============================
security.jwt.enforce=${SECURITY_JWT_ENFORCE:true}
security.jwt.secret=${SECURITY_JWT_SECRET:}
security.jwt.internal-api-key=${SECURITY_INTERNAL_API_KEY:${SECURITY_INVITE_INTERNAL_KEY:}}
